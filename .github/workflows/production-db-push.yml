name: Production Prisma DB Push

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-prisma-db-push
  cancel-in-progress: false

jobs:
  push-and-verify:
    name: Apply and verify production Prisma schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production database target
        shell: bash
        run: |
          set -euo pipefail
          set +x

          node <<'NODE'
          const raw = process.env.DATABASE_URL;

          if (!raw) {
            console.error('Required GitHub secret PRODUCTION_DATABASE_URL is missing.');
            process.exit(1);
          }

          let url;
          try {
            url = new URL(raw);
          } catch {
            console.error('PRODUCTION_DATABASE_URL is not a valid connection URL.');
            process.exit(1);
          }

          const username = decodeURIComponent(url.username);
          const database = decodeURIComponent(url.pathname.replace(/^\/+/, ''));

          const expectedHost = 'aws-0-eu-west-1.pooler.supabase.com';
          const expectedDatabase = 'postgres';
          const expectedUsername = 'postgres.psrmltqgamcebruoutzn';
          const expectedProjectRef = 'psrmltqgamcebruoutzn';

          if (!['postgres:', 'postgresql:'].includes(url.protocol)) {
            console.error('Refusing to continue: expected a PostgreSQL connection URL.');
            process.exit(1);
          }

          if (url.hostname !== expectedHost) {
            console.error('Refusing to continue: database host does not match the approved production host.');
            process.exit(1);
          }

          if (database !== expectedDatabase) {
            console.error('Refusing to continue: database name does not match the approved production database.');
            process.exit(1);
          }

          if (
            username !== expectedUsername ||
            username.split('.')[1] !== expectedProjectRef
          ) {
            console.error('Refusing to continue: username/project reference does not match the approved production project.');
            process.exit(1);
          }

          console.log('Production database target validation passed.');
          NODE

      - name: Push Prisma schema without accepting data loss
        shell: bash
        run: |
          set -euo pipefail
          set +x

          # No destructive flags. Non-interactive stdin ensures Prisma cannot
          # receive confirmation if it prompts about data loss.
          CI=true npx prisma db push --schema=prisma/schema.prisma </dev/null

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Verify User and LoginOtp through Prisma queries
        shell: bash
        run: |
          set -euo pipefail
          set +x

          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient({ log: ['error'] });

          async function verify() {
            const [users, loginOtps] = await Promise.all([
              prisma.user.count(),
              prisma.loginOtp.count(),
            ]);

            console.log(`Prisma User query succeeded; rows: ${users}.`);
            console.log(`Prisma LoginOtp query succeeded; rows: ${loginOtps}.`);
          }

          verify()
            .catch((error) => {
              const code = error && error.code ? ` (${error.code})` : '';
              console.error(`Prisma model verification failed${code}.`);
              process.exitCode = 1;
            })
            .finally(async () => {
              await prisma.$disconnect();
            });
          NODE
